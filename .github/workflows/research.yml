# Investigación de la estrategia (docs/research/PLAN.md) con datos públicos de Kraken.
# Sin claves. Se lanza a mano (Actions → Investigación → Run workflow) o al cambiar
# el código de investigación en la rama de desarrollo.
name: Investigación

on:
  workflow_dispatch:
  push:
    branches: [claude/algo-trading-bot-futures-u4hg9x]
    paths: ["xrpbot/research/**", "docs/research/PLAN*.md", ".github/workflows/research.yml"]

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q -p no:warnings
      - name: Descargar datos de Kraken (API pública, sin claves)
        run: python -m xrpbot.cli download --since 2022-01-01
      - name: Investigación 1 (XRP)
        run: python -m xrpbot.research --out reports/research 2>&1 | grep -v " INFO " | tee research.txt
      - name: Descargar la cesta de contratos (experimento 2)
        run: >
          python -m xrpbot.cli download --since 2022-01-01 --symbols
          PF_XBTUSD PF_ETHUSD PF_SOLUSD PF_XRPUSD PF_ADAUSD PF_DOGEUSD PF_LTCUSD
          PF_LINKUSD PF_DOTUSD PF_AVAXUSD PF_BCHUSD PF_XLMUSD 2>&1 | grep -v " INFO "
      - name: Investigación 2 (cesta diaria)
        run: python -m xrpbot.research.basket --out reports/research2 2>&1 | grep -v " INFO " | tee research2.txt
      - name: Resumen
        if: always()
        run: |
          cat reports/research/informe.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat reports/research2/informe.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat research2.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_number }}
          path: |
            research*.txt
            reports/research/
            reports/research2/
          if-no-files-found: warn
          retention-days: 30
